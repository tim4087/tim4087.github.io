<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {%- assign lang = page.lang | default: site.lang | default: "en" -%}
    <title>
        {%- if page.title -%}{{ page.title | escape }} — {%- endif -%}
        {{ site.title | escape }}
    </title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <!-- favicons -->
    <link rel="icon" type="image/png" href="{{ "/assets/avatar.png" | relative_url }}">
    <link rel="apple-touch-icon" href="{{ "/assets/avatar.png" | relative_url }}">
    <link rel="manifest" href="{{ "/assets/site.webmanifest" | relative_url }}">

    <!-- rss -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

    <!-- mathjax -->
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
</head>
